# Synthetic Review Generator Configuration
# Domain: Gaming & Entertainment
# 
# This example demonstrates configuration for video games,
# gaming platforms, and entertainment streaming services.

generation:
  target_samples: 500
  min_acceptable_samples: 450
  max_retries_per_sample: 3
  batch_size: 15

# Gaming & Entertainment products
products:
  - name: "Stellar Odyssey"
    category: "RPG/Adventure Game"
    description: "Open-world space exploration RPG with multiplayer"
    features: ["Open world", "Character customization", "Multiplayer co-op", "Crafting system", "Dynamic weather"]
    price_tier: "paid"
    
  - name: "StreamVault"
    category: "Streaming Service"
    description: "Premium video streaming platform with 4K content"
    features: ["4K streaming", "Offline downloads", "Multiple profiles", "Personalized recommendations", "Live TV"]
    price_tier: "paid"
    
  - name: "GameCloud Pro"
    category: "Cloud Gaming"
    description: "Cloud gaming service for playing AAA titles anywhere"
    features: ["Cloud saves", "Cross-platform play", "Game library", "Low latency", "Mobile support"]
    price_tier: "paid"
    
  - name: "BattleArena Masters"
    category: "Competitive Multiplayer"
    description: "Free-to-play competitive shooter with ranked modes"
    features: ["Ranked matchmaking", "Seasonal content", "Esports integration", "Anti-cheat", "Clan system"]
    price_tier: "freemium"
    
  - name: "PuzzleMind"
    category: "Casual/Puzzle Game"
    description: "Relaxing puzzle game with daily challenges"
    features: ["Daily puzzles", "No ads option", "Brain training", "Leaderboards", "Colorblind mode"]
    price_tier: "freemium"
    
  - name: "MusicStream Ultra"
    category: "Music Streaming"
    description: "High-fidelity music streaming with lyrics and podcasts"
    features: ["Lossless audio", "Lyrics display", "Podcast integration", "Collaborative playlists", "Offline mode"]
    price_tier: "paid"

# Gaming & Entertainment personas
personas:
  - id: "hardcore_gamer"
    name: "Hardcore Gamer"
    experience_level: "expert"
    priorities: ["performance", "graphics", "gameplay depth", "competitive features"]
    tone: "technical"
    typical_review_length: "long"
    weight: 0.20
    
  - id: "casual_gamer"
    name: "Casual Gamer"
    experience_level: "beginner"
    priorities: ["fun factor", "accessibility", "price", "time commitment"]
    tone: "casual"
    typical_review_length: "short"
    weight: 0.25
    
  - id: "streamer_content_creator"
    name: "Streamer/Content Creator"
    experience_level: "expert"
    priorities: ["stream-worthy moments", "community features", "uniqueness", "stability"]
    tone: "enthusiastic"
    typical_review_length: "medium"
    weight: 0.10
    
  - id: "parent_gamer"
    name: "Parent/Family Gamer"
    experience_level: "intermediate"
    priorities: ["family-friendly", "parental controls", "value", "local co-op"]
    tone: "practical"
    typical_review_length: "medium"
    weight: 0.15
    
  - id: "retro_enthusiast"
    name: "Retro Gaming Enthusiast"
    experience_level: "expert"
    priorities: ["nostalgia", "classic gameplay", "preservation", "authentic experience"]
    tone: "nostalgic"
    typical_review_length: "long"
    weight: 0.10
    
  - id: "binge_watcher"
    name: "Binge Watcher"
    experience_level: "intermediate"
    priorities: ["content library", "binge features", "recommendations", "ad-free"]
    tone: "casual"
    typical_review_length: "medium"
    weight: 0.20

# Rating distribution - gaming reviews tend to be polarized
rating_distribution:
  1: 0.10   # Review bombing common in gaming
  2: 0.08
  3: 0.12
  4: 0.30
  5: 0.40   # Fans are very vocal

# Review characteristics
review_characteristics:
  length:
    short:
      min_words: 15
      max_words: 50
      weight: 0.35
    medium:
      min_words: 50
      max_words: 150
      weight: 0.40
    long:
      min_words: 150
      max_words: 400
      weight: 0.25
      
  aspects_to_cover:
    - "gameplay"
    - "graphics"
    - "story"
    - "multiplayer"
    - "performance"
    - "content library"
    - "price/value"
    - "bugs/stability"
    
  sentiment_markers:
    positive:
      - "addictive"
      - "masterpiece"
      - "best game ever"
      - "can't stop playing"
      - "gorgeous graphics"
      - "amazing story"
      - "worth every penny"
      - "10/10"
      - "GOTY"
    negative:
      - "pay to win"
      - "buggy mess"
      - "unplayable"
      - "dead game"
      - "cash grab"
      - "worst purchase"
      - "refund"
      - "lag"
      - "cheaters everywhere"
    neutral:
      - "decent"
      - "okay"
      - "average"
      - "could be better"
      - "nothing new"
      - "wait for sale"

# Quality thresholds - gaming reviews are often informal
quality_thresholds:
  min_vocabulary_diversity: 0.22
  max_semantic_similarity: 0.78
  min_review_length_chars: 30
  max_review_length_chars: 2500
  required_domain_keywords_ratio: 0.08
  sentiment_rating_alignment: 0.68  # Gaming reviews can be complex
  max_repetition_ratio: 0.18

# Gaming & Entertainment domain keywords
domain_keywords:
  gaming:
    - "game"
    - "play"
    - "level"
    - "character"
    - "multiplayer"
    - "campaign"
    - "boss"
    - "weapons"
    - "skills"
    - "matchmaking"
  technical:
    - "FPS"
    - "graphics"
    - "performance"
    - "lag"
    - "bugs"
    - "patch"
    - "update"
    - "server"
    - "loading"
    - "resolution"
  streaming:
    - "stream"
    - "watch"
    - "content"
    - "library"
    - "download"
    - "quality"
    - "buffer"
    - "subscription"
    - "catalog"
    - "originals"

# Model configuration
models:
  primary: "ollama"
  fallback: "ollama"
  
  ollama:
    enabled: true
    base_url: "http://localhost:11434"
    models:
      - name: "llama3.2"
        priority: 1
        temperature: 0.9  # Higher creativity for gaming reviews
        max_tokens: 500
      - name: "mistral"
        priority: 2
        temperature: 0.85
        max_tokens: 500

output:
  format: "json"
  include_metadata: true
  include_quality_scores: true
  timestamp_format: "%Y-%m-%d %H:%M:%S"
